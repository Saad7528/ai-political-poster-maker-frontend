<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="50%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#bgGrad)" />

  <!-- Borders -->
  <rect x="20" y="20" width="560" height="760" rx="16" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.4" />
  <rect x="28" y="28" width="544" height="744" rx="12" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />

  <!-- Top Religious / Header Banner -->
  <rect x="40" y="45" width="520" height="35" rx="8" fill="#ffffff" fill-opacity="0.1" />
  <text x="300" y="68" font-family="'Hind Siliguri', 'Tiro Bangla', sans-serif" font-size="15" font-weight="bold" fill="#f59e0b" text-anchor="middle">
    বিসমিল্লাহির রাহমানির রাহিম
  </text>

  <!-- Leader Silhouettes Grid -->
  <g transform="translate(180, 105)">
    <circle cx="60" cy="50" r="45" fill="#ffffff" fill-opacity="0.15" stroke="#f59e0b" stroke-width="2" />
    <circle cx="60" cy="40" r="18" fill="#ffffff" fill-opacity="0.3" />
    <path d="M 35 80 Q 60 55 85 80" fill="#ffffff" fill-opacity="0.3" />

    <circle cx="180" cy="50" r="45" fill="#ffffff" fill-opacity="0.15" stroke="#f59e0b" stroke-width="2" />
    <circle cx="180" cy="40" r="18" fill="#ffffff" fill-opacity="0.3" />
    <path d="M 155 80 Q 180 55 205 80" fill="#ffffff" fill-opacity="0.3" />
  </g>

  <!-- Occasion Badge -->
  <rect x="200" y="230" width="200" height="36" rx="18" fill="#f59e0b" />
  <text x="300" y="254" font-family="'Hind Siliguri', 'Tiro Bangla', sans-serif" font-size="16" font-weight="900" fill="#0f172a" text-anchor="middle">
    পহেলা বৈশাখ
  </text>

  <!-- Main Headline -->
  <text x="300" y="320" font-family="'Hind Siliguri', 'Tiro Bangla', sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">
    শুভ নববর্ষ ও পহেলা বৈশাখ
  </text>

  <!-- Slogan -->
  <text x="300" y="365" font-family="'Hind Siliguri', 'Tiro Bangla', sans-serif" font-size="16" fill="#f59e0b" text-anchor="middle">
    ঐক্য, প্রগতি ও সমৃদ্ধির প্রত্যয়ে এগিয়ে চলুন
  </text>

  <!-- Center Decorative Icon -->
  <text x="300" y="440" font-size="50" text-anchor="middle">🌺</text>

  <!-- Candidate Oval Frame -->
  <g transform="translate(320, 480)">
    <rect x="0" y="0" width="230" height="230" rx="115" fill="#ffffff" fill-opacity="0.12" stroke="url(#goldGrad)" stroke-width="3" />
    <circle cx="115" cy="95" r="40" fill="#ffffff" fill-opacity="0.25" />
    <path d="M 55 190 Q 115 130 175 190" fill="#ffffff" fill-opacity="0.25" />
    <text x="115" y="215" font-family="'Hind Siliguri', 'Tiro Bangla', sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      প্রার্থীর ছবি
    </text>
  </g>

  <!-- Candidate Name & Details Box -->
  <g transform="translate(50, 530)">
    <rect x="0" y="0" width="250" height="80" rx="12" fill="#000000" fill-opacity="0.4" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />
    <text x="15" y="32" font-family="'Hind Siliguri', 'Tiro Bangla', sans-serif" font-size="18" font-weight="bold" fill="#ffffff">
      প্রার্থীর নাম ও পদবী
    </text>
    <text x="15" y="58" font-family="'Hind Siliguri', 'Tiro Bangla', sans-serif" font-size="13" fill="#f59e0b">
      বাংলাদেশ জাতীয়তাবাদী দল
    </text>
  </g>

  <!-- Footer Banner -->
  <rect x="20" y="720" width="560" height="60" rx="12" fill="#000000" fill-opacity="0.8" />
  <text x="300" y="756" font-family="'Hind Siliguri', 'Tiro Bangla', sans-serif" font-size="15" font-weight="bold" fill="#e2e8f0" text-anchor="middle">
    প্রচারে: সচেতন নাগরিক ও এলাকাবাসী
  </text>
</svg>